services:
  regpulse-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: regpulse-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8001"
    volumes:
      - ./api:/app
      - ${DATA_DIR:-./data/api}:/data
      - ${REGULATORY_ARCHIVE_PATH:-./data/regulatory_archive}:/archive
      - ${SCRIPTS_PATH:-./scripts}:/opt/scripts:ro
      - ./config:/app/config:ro
    environment:
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-knowledge_base}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-knowledge_base}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-ollama}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - OLLAMA_GEN_MODEL=${OLLAMA_GEN_MODEL:-phi4:14b-q8_0}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-mxbai-embed-large}
      - DATA_DIR=/data
      - DOCLING_HOST=${DOCLING_HOST:-http://docling:5001}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse:3000}
      - HF_TOKEN=${HF_TOKEN:-}
      - RSS_SCHEDULE_HOUR=${RSS_SCHEDULE_HOUR:-9}
      - RSS_SCHEDULE_MINUTE=${RSS_SCHEDULE_MINUTE:-0}
      - RSS_SCHEDULE_TIMEZONE=${RSS_SCHEDULE_TIMEZONE:-Europe/Berlin}
    networks:
      - ai-stack

  regpulse-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: regpulse-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-5173}:5173"
    volumes:
      - ./ui:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_HMR_DISABLED=${VITE_HMR_DISABLED:-true}
    networks:
      - ai-stack

networks:
  ai-stack:
    external: true
