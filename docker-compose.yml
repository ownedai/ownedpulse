services:
  postgres:
    profiles: [postgres]
    image: postgres:16.13
    container_name: ownedpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - ownedpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    profiles: [qdrant]
    image: qdrant/qdrant:v1.19.1
    container_name: ownedpulse-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    networks:
      - ownedpulse
    # healthcheck omitted — qdrant image lacks curl/wget; install.sh checks from host

  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.35.1
    container_name: ownedpulse-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    networks:
      - ownedpulse
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  docling:
    profiles: [docling]
    image: ${DOCLING_IMAGE:-quay.io/docling-project/docling-serve-cu128:v1.35.0}
    container_name: ownedpulse-docling
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      DOCLING_SERVE_ENABLE_UI: "1"
      DOCLING_SERVE_DEFAULT_OCR_KIND: easyocr
      DOCLING_SERVE_ALLOW_CUSTOM_OCR_CONFIG: "true"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      DOCLING_CACHE_DIR: /tmp/docling
    volumes:
      - ${DOCLING_CACHE_DIR:-./data/docling}:/tmp/docling
    ports:
      - "${DOCLING_HOST_PORT:-5001}:5001"
    networks:
      - ownedpulse
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  langfuse:
    profiles: [langfuse]
    image: langfuse/langfuse:2.95.11
    container_name: ownedpulse-langfuse
    restart: unless-stopped
    # install.sh waits for postgres and creates the langfuse DB before
    # starting langfuse, so no depends_on is needed
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD}@${POSTGRES_HOST:-ownedpulse-postgres}:${POSTGRES_PORT:-5432}/${LANGFUSE_DB_NAME:-langfuse}
      NEXTAUTH_URL: ${LANGFUSE_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-ownedpulse-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-OwnedPulse}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-ownedpulse-project}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-OwnedPulse}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    ports:
      - "${LANGFUSE_HOST_PORT:-3001}:3000"
    networks:
      - ownedpulse
    # healthcheck omitted — langfuse image lacks curl/wget; install.sh checks from host

  ownedpulse-api:
    build: ./api
    container_name: ownedpulse-api
    restart: unless-stopped
    environment:
      # Connect ports. Bundled services listen on fixed container-internal
      # ports (qdrant 6333, postgres 5432, ollama 11434) — the published host
      # ports (*_HOST_PORT) never appear here. Set *_PORT only in external
      # mode, to the port the remote service listens on.
      QDRANT_HOST: ${QDRANT_HOST:-ownedpulse-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-knowledge_base}
      POSTGRES_HOST: ${POSTGRES_HOST:-ownedpulse-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ownedpulse-ollama:11434}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
      OLLAMA_GEN_MODEL: ${OLLAMA_GEN_MODEL:-phi4:14b-q8_0}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-mxbai-embed-large}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-12288}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      DATA_DIR: /data
      DOCLING_HOST: ${DOCLING_HOST:-http://ownedpulse-docling:5001}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://ownedpulse-langfuse:3000}
      HF_TOKEN: ${HF_TOKEN:-}
      RSS_SCHEDULE_HOUR: ${RSS_SCHEDULE_HOUR:-9}
      RSS_SCHEDULE_MINUTE: ${RSS_SCHEDULE_MINUTE:-0}
      RSS_SCHEDULE_TIMEZONE: ${RSS_SCHEDULE_TIMEZONE:-Europe/Berlin}
    volumes:
      - ./api:/app
      - ${DATA_DIR:-./data/api}:/data
      - ${REGULATORY_ARCHIVE_PATH:-./data/regulatory_archive}:/archive
      - ${SCRIPTS_PATH:-./scripts}:/opt/scripts:ro
      - ./config:/app/config:ro
    ports:
      - "${API_PORT:-8001}:8001"
    networks:
      - ownedpulse
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8001/api/health | grep -q status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s

  ownedpulse-ui:
    build: ./ui
    container_name: ownedpulse-ui
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_HMR_DISABLED: ${VITE_HMR_DISABLED:-false}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./ui:/app
      - /app/node_modules
    ports:
      - "${UI_PORT:-5173}:5173"
    networks:
      - ownedpulse

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:

networks:
  ownedpulse:
    driver: bridge
